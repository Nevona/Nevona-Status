owner: Nevona
repo: Nevona-Status

# Slack alerts to #alerts. The webhook URL is a repo secret and the webhook itself fixes the channel.
# This list is authoritative: only these secrets reach the Uptime CI run (GH_PAT is passed separately).
secrets:
  - NOTIFICATION_SLACK
  - NOTIFICATION_SLACK_WEBHOOK_URL

# `group` and `core` are read only by the Nevona status page (status-page/scripts/build-data.mjs).
# Vendors are probed on their own status APIs, so a vendor-reported incident shows here, not just reachability.
# Vendor names stay generic on the page (no `tag`), so the page doesn't advertise our providers.
# Upptime matches bodies by substring: `__dangerous__body_down` / `__dangerous__body_degraded` flip a 200 to down / degraded.
sites:
  - name: Web app
    slug: web-app
    url: https://prod.nevona.ai
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: 'id="root"'
    core: true
  - name: Platform API
    slug: platform-api
    url: https://api.prod.nevona.ai/health
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    core: true
  - name: Sign-in
    slug: sign-in
    url: https://clerk.nevona.ai/v1/health
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"healthy"'
    core: true
  # The worker controller speaks only gRPC; a plain GET getting its 415 proves it's serving (the LB would 502/503).
  - name: Endpoint connectivity
    slug: endpoint-connectivity
    url: https://workers.prod.nevona.ai/
    expectedStatusCodes: [415]
    core: true
  # The egress proxy answers a plain GET with a 400 and this text (services/proxy/src/servers/proxy/handle.go).
  - name: Integrations
    slug: integrations
    url: https://proxy.prod.nevona.ai/
    expectedStatusCodes: [400]
    __dangerous__body_down_if_text_missing: "This is a proxy"
  - name: Documentation
    slug: documentation
    url: https://docs.nevona.ai
  # Only the "Claude API (api.anthropic.com)" component - claude.ai or Claude Code incidents don't affect Nevona.
  - name: AI model provider
    slug: ai-model-provider
    url: https://status.claude.com/api/v2/components/k8w3r06qmzrp.json
    expectedStatusCodes: [200]
    __dangerous__body_down: '_outage"' # partial_outage or major_outage
    __dangerous__body_degraded: '"status":"degraded_performance"'
    group: vendor
    core: true
  # incidents.json can't express "active and severe" as a substring; the dashboard's own banner does.
  - name: Cloud hosting
    slug: cloud-hosting
    url: https://status.cloud.google.com/
    expectedStatusCodes: [200]
    __dangerous__body_degraded_if_text_missing: "No broad severe incidents"
    group: vendor
  # Better Stack page; the page and each active report carry an aggregate_state.
  - name: Workflow compute
    slug: workflow-compute
    url: https://status.modal.com/index.json
    expectedStatusCodes: [200]
    __dangerous__body_down: '"aggregate_state":"downtime"'
    __dangerous__body_degraded: '"aggregate_state":"degraded"'
    group: vendor
  # Statuspage-style indicator: critical = major outage, major = partial outage, minor is ignored as noise.
  - name: Identity provider
    slug: identity-provider
    url: https://status.clerk.com/api/v2/status.json
    expectedStatusCodes: [200]
    __dangerous__body_down: '"indicator":"critical"'
    __dangerous__body_degraded: '"indicator":"major"'
    group: vendor
  - name: Alert test
    slug: alert-test
    url: https://docs.nevona.ai
    expectedStatusCodes: [200]

status-website:
  cname: status.nevona.ai
  name: Nevona Status
  logoUrl: /nevona-mark.svg
  favicon: /nevona-mark.svg
  faviconSvg: /nevona-mark.svg
  introTitle: Nevona platform status
  introMessage: Live health of the Nevona platform and its services. Refreshed every few minutes.
  theme: default

# Sentence case everywhere (Nevona casing law - no Title Case).
i18n:
  liveStatus: Live status
  activeIncidents: Active incidents
  pastIncidents: Past incidents
  allSystemsOperational: All systems operational
  scheduledMaintenance: Scheduled maintenance
  pastScheduledMaintenance: Past scheduled maintenance
  incidentDetails: Incident details
  incidentViewOnGitHub: View and subscribe on GitHub
  overallUptimeTitle: Overall uptime
  averageResponseTimeTitle: Average response
  lastUpdated: Last updated
  lastUpdatedJustNow: just now

# See https://upptime.js.org/docs/configuration
