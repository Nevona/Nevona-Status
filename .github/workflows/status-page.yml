# Builds and deploys the custom Nevona status page (status-page/) to GitHub Pages.
# Not generated by Upptime: its template updates only rewrite their own workflow files.
# Pages is set to "GitHub Actions" mode, so Upptime's own gh-pages builds are not served.
name: Status Page CI
on:
  workflow_run:
    workflows: [Uptime CI, Summary CI]
    types: [completed]
  push:
    branches: [master]
    paths:
      - "status-page/**"
      - "notice.json"
      - ".upptimerc.yml"
      - ".github/workflows/status-page.yml"
  issues:
    types: [opened, closed, reopened, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
concurrency:
  group: status-page
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
jobs:
  deploy:
    name: Build and deploy status page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: status-page
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: status-page/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - name: Build data
        run: node scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site
        run: npm run export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: status-page/__sapper__/export
      - id: deployment
        uses: actions/deploy-pages@v4
