# Locks every new issue so only the Nevona team can comment - the repo is public and
# incident comments are shown on status.nevona.ai. Not generated by Upptime.
name: Lock Incidents CI
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  lock:
    name: Lock issue to collaborators
    runs-on: ubuntu-latest
    steps:
      - run: gh issue lock ${{ github.event.issue.number }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
