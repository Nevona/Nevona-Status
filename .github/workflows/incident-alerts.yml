# Posts Slack alerts for the incidents Upptime opens and closes, with the vendor's own incident
# details for vendor sites. Replaces Upptime's built-in alert (`secrets: []` in .upptimerc.yml).
# Not generated by Upptime: its template updates only rewrite their own workflow files.
name: Incident Alerts CI
on:
  issues:
    types: [opened, closed]
permissions:
  contents: read
jobs:
  alert:
    name: Post Slack alert
    if: contains(github.event.issue.labels.*.name, 'status')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read site config
        run: yq -o=json .upptimerc.yml > "$RUNNER_TEMP/upptimerc.json"
      - name: Post alert
        run: node .github/scripts/incident-alert.mjs
        env:
          CONFIG_PATH: ${{ runner.temp }}/upptimerc.json
          SLACK_WEBHOOK_URL: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK_URL }}
